name: Android Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

env:
  TELEGRAM_API_ID: 1535417
  TELEGRAM_API_HASH: 680c59342dffae3c680ee8a9c37f39be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.12 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap Android SDK (NDK + CMake + platform)
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-37" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PingPong-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
