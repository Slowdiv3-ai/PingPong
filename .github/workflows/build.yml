name: Android Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

env:
  TELEGRAM_API_ID: 1535417
  TELEGRAM_API_HASH: 680c59342dffae3c680ee8a9c37f39be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.12 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap Android SDK (NDK + CMake + platform)
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-37" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          $APKSIGNER sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/pingpong-signed.apk \
            "$APK_PATH"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pingpong-signed
          path: app/build/outputs/apk/pingpong-signed.apk

